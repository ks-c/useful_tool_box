<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>山间咖啡馆 - 示例站点</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <img src="images/logo.svg" class="logo" alt="Logo">
  <h1 class="title">山间咖啡馆</h1>
  <nav>
    <a href="index.html">首页</a>
    <a href="page2.html">菜单页</a>
  </nav>
</header>
<main>
  <section class="hero">
    <h2>清晨的一杯手冲咖啡</h2>
    <p class="hero-text">在海拔 1200 米的山间，我们用心烘焙每一颗豆子。</p>
    <button class="btn">立即预订</button>
  </section>
  <section class="cards">
    <div class="card">
      <h3>招牌拿铁</h3>
      <p>丝滑奶泡与深烘浓缩的完美结合。</p>
      <span class="badge">热销</span>
    </div>
    <div class="card highlight">
      <h3>手冲耶加雪菲</h3>
      <p>明亮果酸，茉莉花香，回甘悠长。</p>
      <span class="badge">新品</span>
    </div>
    <div class="card">
      <h3>经典美式</h3>
      <p>简单纯粹，唤醒每一个清晨。</p>
    </div>
  </section>
  <p class="footer-note">营业时间：每日 8:00 - 20:00</p>
</main>
<script src="js/app.js"></script>
</body>
</html>
